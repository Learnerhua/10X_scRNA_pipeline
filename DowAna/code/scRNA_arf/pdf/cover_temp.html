<body>

		<strong>BGI Co., Ltd.</strong><br />
		<span id="date" style="font-size:28px"><script type="text/javascript">
                        var today = new Date();
			var dayName = new Array("", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday");
    			var monName = new Array("Jan. ", "Feb.", "Mar.", "Apr.", "May", "Jun.", "Jul.", "Aug.", "Sept.", "Oct.", "Nov.", "Dec.");
			var strDay;
			if ((today.getDate() == 1) || (today.getDate() != 11) && (today.getDate() % 10 == 1))   // Correction for 11th and 1st/21st/31st
    			strDay = "st ";
    			else if ((today.getDate() == 2) || (today.getDate() != 12) && (today.getDate() % 10 == 2)) // Correction for 12th and 2nd/22nd/32nd
    			strDay = "nd ";
    			else if ((today.getDate() == 3) || (today.getDate() != 13) && (today.getDate() % 10 == 3)) // Correction for 13th and 3rd/23rd/33rd
    			strDay = "rd ";
    			else
    			strDay = "th ";
                        document.write( dayName[today.getDay()]   +", " + today.getDate() + strDay    + " " + monName[today.getMonth()]+', '+ today.getFullYear());
                </script></span>

	<script type="text/javascript">
	    $(function () {
	        $(".download").each(function () {
	            var width = $(this).parent().next(".table-container").children("table").width();
	            var floatright = width;

	            if (floatright <= 960) {
	                $(this).css("margin-left", floatright - 60 + "px");
	            } else {
	                $(this).css("margin-left", "960px");
	            }
	        });
	        var w = 0;
	        var h = $(".catalog").height();


	        $(".catalog_li a").each(function () {
	            var width = $(this).width();
	            if (width > w) {
	                w = width;
	            }
	        });
	        $(".catalog").width(w + 40 + "px");
	        //$("ul.left_ul li:odd").css("background-color", "#d3e6f9");
	        $(".span_hide").toggle(function () {
	            $(".catalog_li").hide();
	            $(this).text("[Show]")

	        }, function () {

	            $(".catalog_li").show();
	            $(this).text("[Hide]");
	        });
	        $(".catalog").height();

		var height = $(".content").height();

		if (710 - height < 60 && 710 - height >0) {             
                	$(".footer").css("margin-top", 710 - height + "px");
            	} else if (710 - height >60) {           
                	$(".footer").css("margin-top", 710 - height - 60 + "px");
            	}

		$(".confirm").click(function () {
	            var text = $(this).prev().val();
	            if (text.length == "0") {
	                alert("Please enter sample key word! ")
	                return;
	            }
	            $(this).parents("div.lane").find("ul.imglist li").each(function () {
					
					if ($(this).text().toLowerCase().indexOf(text.toLowerCase()) >= 0) {
	                    $(this).show();
	                } else {
	                    $(this).hide();
	                }

	            })
	        });
	        $(".showall").click(function () {
	            $(this).parents("div.lane").find("ul.imglist li").each(function () {
	                $(this).show();
	            })
	        });
		$(".download1").find("img").mouseenter(function () {
	            $(this).parent().next().show();

	        });
	        $(".download1").mouseleave(function () {
	            $(".showMessage").hide();
	        });

	    })
    </script>
